name: Update Umami guide stats

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Umami pageviews
        env:
          UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}
          UMAMI_WEBSITE_ID: ae881afe-4d3a-4813-8750-4247bb5b1934
        run: |
          set -euo pipefail

          END_AT=$(date +%s000)
          URL='https://cloud.umami.is/api/websites/'"${UMAMI_WEBSITE_ID}"'/pageviews?startAt=0&endAt='"${END_AT}"'&unit=month'
          curl -fsSL "$URL" \
            -H "Authorization: Bearer ${UMAMI_API_KEY}" \
            -H "Accept: application/json" \
            -o /tmp/umami.json

          jq -e '.pageviews' /tmp/umami.json >/dev/null

          jq '
            reduce .pageviews[] as $row
              ({}; .[$row.x] = ((.[$row.x] // 0) + ($row.y // 0)))
          ' /tmp/umami.json > /tmp/monthly.json

          # The API returns a series grouped by URL only when url is supplied.
          # Fetch URL metrics separately so every guide gets its own total.
          python3 - <<'PY'
          import json, os, subprocess, urllib.parse, urllib.request

          website = os.environ["UMAMI_WEBSITE_ID"]
          key = os.environ["UMAMI_API_KEY"]
          paths = [
              "/COD-Guides/guides/magma/",
              "/COD-Guides/guides/ursus/",
              "/COD-Guides/guides/hydra/",
              "/COD-Guides/guides/mehastrazh/",
              "/COD-Guides/guides/vosstavshiy-gigant/",
              "/COD-Guides/guides/sumrachnyi-drakon/",
              "/COD-Guides/guides/lihoursus/",
              "/COD-Guides/guides/miazmovyi-gigant/",
              "/COD-Guides/guides/kosmicheskiy-ruh/",
              "/COD-Guides/guides/haribda/",
              "/COD-Guides/guides/plameneya/",
              "/COD-Guides/guides/gromovoi-drakon/",
              "/COD-Guides/guides/ledyanoi-gigant/",
              "/COD-Guides/guides/giant/",
          ]

          result = {}
          for path in paths:
              query = urllib.parse.urlencode({
                  "startAt": "0",
                  "endAt": str(int(__import__("time").time() * 1000)),
                  "unit": "month",
                  "url": path,
              })
              req = urllib.request.Request(
                  f"https://cloud.umami.is/api/websites/{website}/pageviews?{query}",
                  headers={"Authorization": f"Bearer {key}", "Accept": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
              total = sum(int(item.get("y", 0)) for item in data.get("pageviews", []))
              result[path] = total

          os.makedirs("_data", exist_ok=True)
          with open("_data/view_counts.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/view_counts.json
          git diff --cached --quiet || git commit -m "Update Umami guide view counts"
          git push
