{% assign current_url = page.url %}
{% if current_url contains '/en/' %}
  {% assign ru_url = current_url | remove_first: '/en' %}
  {% assign en_url = current_url %}
{% else %}
  {% assign ru_url = current_url %}
  {% assign en_url = current_url | prepend: '/en' %}
{% endif %}
<div class="language-switcher" role="group" aria-label="{% if page.url contains '/en/' %}Language{% else %}Язык{% endif %}">
  <a href="{{ ru_url | relative_url }}" data-language="ru" lang="ru">RU</a>
  <a href="{{ en_url | relative_url }}" data-language="en" lang="en">EN</a>
</div>
<style>
.language-switcher{display:flex;gap:5px;align-items:center}
.language-switcher a{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:30px;padding:0 9px;border:1px solid var(--line,rgba(255,255,255,.12));border-radius:9px;color:var(--muted,#9aa3b2);font-size:11px;font-weight:800;letter-spacing:.06em;text-decoration:none}
.language-switcher a[aria-current="true"]{background:var(--accent,rgba(255,255,255,.1));color:var(--text,#fff);border-color:var(--accent,rgba(255,255,255,.2))}
</style>
<script>
(function(){
 var key='cod-guides-language',path=location.pathname,base='/COD-Guides';
 var isEn=path===base+'/en'||path.indexOf(base+'/en/')===0;
 var current=isEn?'en':'ru';
 try{
  var saved=localStorage.getItem(key);
  if(saved!=='en'&&saved!=='ru'){
   var browser=(navigator.languages&&navigator.languages[0]||navigator.language||'ru').toLowerCase();
   saved=browser.indexOf('en')===0?'en':'ru';
   localStorage.setItem(key,saved);
  }
  if(saved!==current){
   var relative=path.indexOf(base)===0?path.slice(base.length):'/';
   var target;
   if(saved==='en'){
    target=base+'/en'+(relative==='/'?'/':relative);
   }else{
    relative=relative.replace(/^\/en(?=\/|$)/,'');
    target=base+(relative===''?'/':relative);
   }
   location.replace(target+location.search+location.hash);return;
  }
  document.documentElement.lang=current;
 }catch(e){}
 document.querySelectorAll('.language-switcher a').forEach(function(a){
  a.setAttribute('aria-current',String(a.dataset.language===current));
  a.addEventListener('click',function(){try{localStorage.setItem(key,a.dataset.language)}catch(e){}});
 });
})();
</script>
