<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b10">
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="COD Guides">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
<meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
<title>{{ page.title | default: site.title }} — COD Guides</title>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=20261001-2">
<script defer src="{{ '/assets/js/site.js' | relative_url }}?v=20261001-5"></script>
{% if site.goatcounter_code and site.goatcounter_code != "" %}<script data-goatcounter="https://{{ site.goatcounter_code }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>{% endif %}
</head>
<body><div class="reading-progress" data-reading-progress aria-hidden="true"></div><button class="back-top" data-back-top type="button" aria-label="Наверх">↑</button>
<header class="top">
  <a href="{{ '/' | relative_url }}" class="brand">🔥 COD <b>GUIDES</b></a>
</header>
<main class="page home-page">
  {{ content }}
</main>
<nav class="mobile-nav" data-mobile-nav aria-label="Мобильная навигация"><a href="{{ '/' | relative_url }}" class="mobile-nav-item is-active">⌂<span>Главная</span></a><button type="button" class="mobile-nav-item" data-mobile-action="search">⌕<span>Поиск</span></button><button type="button" class="mobile-nav-item" data-mobile-action="top">↑<span>Наверх</span></button></nav>
<footer>🔥 COD Guides · Call of Dragons</footer>
</body>
</html>
