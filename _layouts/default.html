<!doctype html>
<html lang="{% if page.url contains '/en/' %}en{% else %}ru{% endif %}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b10"><script>(function(){try{var t=localStorage.getItem("cod-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}})();</script>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
{% if page.url contains '/en/' %}
<link rel="alternate" hreflang="en" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="ru" href="{{ page.url | remove_first: '/en' | absolute_url }}">
{% else %}
<link rel="alternate" hreflang="ru" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="en" href="{{ page.url | prepend: '/en' | absolute_url }}">
{% endif %}
<meta property="og:type" content="website">
<meta property="og:site_name" content="COD Guides">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
<meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
<title>{{ page.title | default: site.title }} — COD Guides</title>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=20261002-1">
<script defer src="{{ '/assets/js/site.js' | relative_url }}?v=20261002-1"></script>
</head>
<body><div class="reading-progress" data-reading-progress aria-hidden="true"></div><button class="back-top" data-back-top type="button" aria-label="{% if page.url contains '/en/' %}Back to top{% else %}Наверх{% endif %}">↑</button>
<header class="top">
  <a href="{% if page.url contains '/en/' %}{{ '/en/' | relative_url }}{% else %}{{ '/' | relative_url }}{% endif %}" class="brand">🔥 COD <b>GUIDES</b></a>
  {% include language-switcher.html %}
  <button class="theme-toggle desktop-theme-toggle" type="button" data-theme-toggle aria-label="{% if page.url contains '/en/' %}Toggle theme{% else %}Переключить тему{% endif %}" aria-pressed="false">🌙</button>
</header>
<main class="page home-page">
  {{ content }}
</main>
<nav class="mobile-nav" data-mobile-nav aria-label="{% if page.url contains '/en/' %}Mobile navigation{% else %}Мобильная навигация{% endif %}">
<a href="{% if page.url contains '/en/' %}{{ '/en/' | relative_url }}{% else %}{{ '/' | relative_url }}{% endif %}" class="mobile-nav-item is-active">⌂<span>{% if page.url contains '/en/' %}Home{% else %}Главная{% endif %}</span></a>
<button type="button" class="mobile-nav-item" data-mobile-action="search">⌕<span>{% if page.url contains '/en/' %}Search{% else %}Поиск{% endif %}</span></button>
<button type="button" class="mobile-nav-item" data-theme-toggle aria-label="Переключить тему">🌙<span>{% if page.url contains '/en/' %}Theme{% else %}Тема{% endif %}</span></button>
<button type="button" class="mobile-nav-item" data-mobile-action="top">↑<span>{% if page.url contains '/en/' %}Top{% else %}Наверх{% endif %}</span></button>
</nav>
<footer>🔥 COD Guides · Call of Dragons</footer>
</body>
</html>
