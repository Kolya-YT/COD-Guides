<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="32" fill="#080d16"/><text x="60" y="72" fill="#70c8ff" font-family="Arial" font-size="28" font-weight="700">ГРОМОВОЙ РУХ · НАКОПЛЕНИЕ ЗАРЯДА</text><text x="60" y="125" fill="white" font-family="Arial" font-size="44" font-weight="800">Следи за метками ⚡</text><g transform="translate(600 330)"><circle r="150" fill="#10283b" stroke="#70c8ff" stroke-width="6"/><text x="0" y="25" text-anchor="middle" font-size="80">⚡</text><g fill="#ffd95c"><circle cx="0" cy="-210" r="18"><animate attributeName="cy" values="-210;-150;-210" dur="1s" repeatCount="indefinite"/></circle><circle cx="150" cy="-150" r="18"><animate attributeName="cx" values="150;190;150" dur="1.2s" repeatCount="indefinite"/></circle><circle cx="-150" cy="-150" r="18"><animate attributeName="cx" values="-150;-190;-150" dur="1.1s" repeatCount="indefinite"/></circle><circle cx="210" cy="0" r="18"><animate attributeName="cx" values="210;245;210" dur=".9s" repeatCount="indefinite"/></circle></g></g><text x="100" y="240" fill="#d9f4ff" font-family="Arial" font-size="29">1. Получил метку</text><text x="100" y="285" fill="#d9f4ff" font-family="Arial" font-size="29">2. Отойди от союзников</text><text x="100" y="330" fill="#d9f4ff" font-family="Arial" font-size="29">3. Дождись снятия заряда</text></svg>