<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="32" fill="#090c13"/><text x="60" y="75" fill="#7aa7ff" font-family="Arial" font-size="28" font-weight="700">ГРОМОВОЙ РУХ · ЭЛЕКТРИЧЕСКИЕ МЕТКИ</text><text x="60" y="125" fill="white" font-family="Arial" font-size="46" font-weight="800">Метка → отход → удар → возвращение</text><ellipse cx="850" cy="350" rx="250" ry="150" fill="#112f4b" stroke="#5e9dff" stroke-width="5"/><text x="850" y="390" text-anchor="middle" font-size="110">⚡</text><circle cx="300" cy="230" r="32" fill="#8ce1ff"/><circle cx="450" cy="470" r="32" fill="#8ce1ff"/><circle cx="590" cy="190" r="32" fill="#8ce1ff"/><path d="M300 230 L450 470 L590 190" stroke="#f4df63" stroke-width="8" stroke-dasharray="14 12"/><text x="90" y="185" fill="#c8d0e2" font-family="Arial" font-size="28">Не собирайте отмеченные легионы</text><text x="90" y="225" fill="#c8d0e2" font-family="Arial" font-size="28">в одной точке и не стойте в воде.</text></svg>