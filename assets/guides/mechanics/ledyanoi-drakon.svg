<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#061b35"/><stop offset=".55" stop-color="#0b4774"/><stop offset="1" stop-color="#071226"/></linearGradient><radialGradient id="d"><stop stop-color="#baf7ff"/><stop offset=".45" stop-color="#36a9ff"/><stop offset="1" stop-color="#153c8c"/></radialGradient><filter id="g"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="700" rx="28" fill="url(#b)"/><text x="55" y="70" fill="#fff" font-size="38" font-weight="800">❄️ ЛЕДЯНОЙ ДРАКОН — механики</text><text x="55" y="108" fill="#b9efff" font-size="19">Главное: Ледяное проклятие → зоны → Холодный фронт → Зимний приговор</text><g transform="translate(55 145)"><rect width="520" height="490" rx="22" fill="#082640" stroke="#53dfff" stroke-width="2"/><text x="25" y="45" fill="#6ce9ff" font-size="25" font-weight="800">1 · ПРОКЛЯТИЕ</text><circle cx="260" cy="205" r="90" fill="url(#d)" stroke="#d7fbff" stroke-width="5"/><path d="M210 220 L250 155 L275 205 L330 160" fill="none" stroke="#e8ffff" stroke-width="11"/><g transform="translate(70 330)"><rect width="380" height="48" rx="20" fill="#06213a"/><rect width="285" height="48" rx="20" fill="#3ed6ff"><animate attributeName="width" values="120;360;120" dur="2.8s" repeatCount="indefinite"/></rect><text x="18" y="32" fill="#fff" font-size="18" font-weight="700">ЛЕДЯНОЕ ПРОКЛЯТИЕ · 0 → 10</text></g><text x="25" y="455" fill="#fff" font-size="18">Каждый стак замедляет легион.</text><text x="25" y="487" fill="#9cecff" font-size="18" font-weight="700">10 стаков = заморозка на 3 секунды.</text></g><g transform="translate(620 145)"><rect width="525" height="490" rx="22" fill="#082640" stroke="#3ebfff" stroke-width="2"/><text x="25" y="45" fill="#6ce9ff" font-size="25" font-weight="800">2 · ЗОНЫ И ФРОНТ</text><g filter="url(#g)"><path d="M85 190 L150 100 L215 1