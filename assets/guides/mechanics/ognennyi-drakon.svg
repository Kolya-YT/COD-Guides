<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#250900"/><stop offset=".55" stop-color="#5b1600"/><stop offset="1" stop-color="#160500"/></linearGradient><radialGradient id="d"><stop stop-color="#ffca54"/><stop offset=".45" stop-color="#ff5a12"/><stop offset="1" stop-color="#6e1000"/></radialGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#ffd15c"/></marker></defs><rect width="1200" height="700" rx="28" fill="url(#b)"/><text x="55" y="70" fill="#fff" font-size="38" font-weight="800">🔥 ОГНЕННЫЙ ДРАКОН — механики</text><text x="55" y="108" fill="#ffd0a1" font-size="19">Главное: стаки → смена танка → раздельные зоны → ящеры</text><g transform="translate(55 145)"><rect width="520" height="490" rx="22" fill="#321008" stroke="#ff7b28" stroke-width="2"/><text x="25" y="45" fill="#ff9d43" font-size="25" font-weight="800">1 · СТАКИ И ТАНКИ</text><circle cx="260" cy="205" r="95" fill="url(#d)" stroke="#ffcf66" stroke-width="5"/><path d="M185 195 Q130 140 95 185 Q140 210 185 225 M335 195 Q390 140 425 185 Q380 210 335 225" fill="none" stroke="#ffcf66" stroke-width="16"/><g transform="translate(75 330)"><rect width="370" height="48" rx="20" fill="#5b1b08"/><rect width="300" height="48" rx="20" fill="#ff6420"><animate attributeName="width" values="300;365;300" dur="2s" repeatCount="indefinite"/></rect><text x="18" y="32" fill="#fff" font-size="18" font-weight="700">ПЫЛАЮЩЕЕ РАЗРУШЕНИЕ · 0 → 10</text></g><path d="M180 420 Q260 390 340 420" fill="none" stroke="#ffd15c" stroke-width="6" marker-end="url(#a)"/><text x="25" y="455" fill="#fff" font-size="18">До 10 стаков — второй танк забирает босса.</text><text x="25" y="487" fill="#ffb07b" font-size="18">Первый танк отходит и сбрасывает стаки.</text></g><g transform="translate(620 145)"><rect width="525" height="490" rx="22" fill="#321008" stroke="#ff4e2e" stroke-width="2"/><text x="25" y="45" fill="#ff9d43" font-size="25" font-weight="800">2 · АТАКИ И ЯЩЕРЫ</text><g><circle cx="155" cy="170" r="62" fill="#3d0b05" stroke="#ff4020" stroke-width="5"/><path d="M155 110 L155 170 L220 205" stroke="#ff9b33" stroke-width="13" fill="none"/><text x="70" y="270" fill="#fff" font-size="18">Огненная линия</text></g><g><circle cx="390" cy="170" r="62" fill="#3d0b05" stroke="#ffb52e" stroke-width="5"/><circle cx="390" cy="170" r="30" fill="none" stroke="#ff5b22" stroke-width="8"><animate attributeName="r" values="20;55;20" dur="1.6s" repeatCount="indefinite"/></circle><text x="335" y="270" fill="#fff" font-size="18">Опасная зона</text></g><g transform="translate(45 315)"><circle cx="65" cy="60" r="35" fill="#9a2b0e"/><path d="M30 60 L100 60" stroke="#ffcc66" stroke-width="8"/><text x="125" y="50" fill="#fff" font-size="18">Ящер: держать отдельно</text><text x="125" y="80" fill="#ffb07b" font-size="18">и взрывать вдали от рейда.</text></g><text x="25" y="450" fill="#fff" font-size="18">☄️ Разбегайтесь от массовых огненных зон.</text><text x="25" y="485" fill="#ffb07b" font-size="18">💚 После детонации забирайте камень лечения.</text></g></svg>