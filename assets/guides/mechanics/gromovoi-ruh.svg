<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090d25"/><stop offset=".55" stop-color="#24104b"/><stop offset="1" stop-color="#070b1c"/></linearGradient><radialGradient id="boss"><stop stop-color="#ff8cff"/><stop offset=".45" stop-color="#7b35ff"/><stop offset="1" stop-color="#20104c"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#7de7ff"/></marker></defs><rect width="1200" height="700" rx="28" fill="url(#bg)"/><text x="55" y="70" fill="#fff" font-size="38" font-weight="800">⚡ ГРОЗОВОЙ РУХ — механики</text><text x="55" y="108" fill="#aeb8e8" font-size="19">Визуальная шпаргалка: вода → метки → полёт → камни маны</text><g transform="translate(55 145)"><rect width="340" height="490" rx="22" fill="#11162f" stroke="#38cfff" stroke-width="2"/><text x="24" y="45" fill="#58dfff" font-size="25" font-weight="800">1 · ВОДА</text><circle cx="170" cy="205" r="105" fill="#123e72" stroke="#45d9ff" stroke-width="5"/><path d="M90 205 Q170 130 250 205 Q170 280 90 205" fill="none" stroke="#8ff4ff" stroke-width="9" opacity=".8"/><g filter="url(#glow)"><path d="M170 85 L170 165" stroke="#ff4bff" stroke-width="9"/></g><circle cx="170" cy="205" r="58" fill="url(#boss)" opacity=".9"/><path d="M130 200 Q170 155 210 200 Q170 245 130 200" fill="#d8d8ff"/><text x="24" y="355" fill="#fff" font-size="19">Рух в воде = вода заряжается</text><text x="24" y="388" fill="#ff8b8b" font-size="19" font-weight="700">❌ Не стойте в заряженной воде</text><text x="24" y="430" fill="#9be9ff" font-size="18">Отходите на сухой сектор.</text><path d="M120 490 L260 490" stroke="#62e9ff" stroke-width="5" marker-end="url(#arr)"><animate attributeName="x1" values="120;175;120" dur="1.4s" repeatCount="indefinite"/></path></g><g transform="translate(430 145)"><rect width="340" height="490" rx="22" fill="#11162f" stroke="#cf58ff" stroke-width="2"/><text x="24" y="45" fill="#e47aff" font-size="25" font-weight="800">2 · МЕТКИ</text><g fill="none" stroke="#e94cff" stroke-width="4"><circle cx="100" cy="170" r="38"/><circle cx="240" cy="170" r="38"/><circle cx="170" cy="315" r="38"/></g><g fill="#e94cff"><circle cx="100" cy="170" r="10"/><circle cx="240" cy="170" r="10"/><circle cx="170" cy="315" r="10"/></g><circle cx="170" cy="245" r="55" fill="url(#boss)" opacity=".75"/><path d="M170 245 L100 170 M170 245 L240 170 M170 245 L170 315" stroke="#7de7ff" stroke-width="4" stroke-dasharray="10 9"><animate attributeName="stroke-dashoffset" from="0" to="-38" dur="1s" repeatCount="indefinite"/></path><text x="24" y="385" fill="#fff" font-size="19">3 легиона получают метку.</text><text x="24" y="420" fill="#ff8b8b" font-size="19" font-weight="700">↔ Разойтись в разные стороны.</text><text x="24" y="455" fill="#aeb8e8" font-size="18">Не собирайтесь рядом с другими</text><text x="24" y="480" fill="#aeb8e8" font-size="18">мечеными легионами.</text></g><g transform="translate(805 145)"><rect width="340" height="490" rx="22" fill="#11162f" stroke="#ffb84d" stroke-width="2"/><text x="24" y="45" fill="#ffc15c" font-size="25" font-weight="800">3 · ПОЛЁТ</text><circle cx="170" cy="185" r="70" fill="url(#boss)" opacity=".85"/><path d="M95 165 Q40 115 20 175 Q75 190 110 205 M245 165 Q300 115 320 175 Q265 190 230 205" fill="none" stroke="#d9c7ff" stroke-width="13"/><g fill="#57eaff" stroke="#fff" stroke-width="2"><path d="M80 330 l18 -32 l18 32 l-18 32z"/><path d="M170 360 l18 -32 l18 32 l-18 32z"/><path d="M260 330 l18 -32 l18 32 l-18 32z"/></g><path d="M100 270 C80 300 80 320 95 340 M200 270 C240 300 250 320 270 340" fill="none" stroke="#62e9ff" stroke-width="5" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" from="0" to="70" dur="1s" repeatCount="indefinite"/></path><text x="24" y="410" fill="#fff" font-size="19">Рух становится неуязвимым.</text><text x="24" y="445" fill="#8ff4ff" font-size="19" font-weight="700">🪨 Соберите все камни маны.</text><text x="24" y="480" fill="#fff" font-size="18">После сбора Рух падает в центр</text><text x="24" y="505" fill="#ffd17c" font-size="18" font-weight="700">и ненадолго оглушается.</text></g></svg>